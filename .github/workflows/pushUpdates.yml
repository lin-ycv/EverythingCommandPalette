name: Push ECP updates to package managers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag (blank = latest ECP release)"
        required: false
        type: string
      dry_run:
        description: "Generate and validate without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve-release:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: windows-latest
    outputs:
      found: ${{ steps.resolve.outputs.found }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.resolve.outputs.version }}
      assets: ${{ steps.resolve.outputs.assets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Resolve ECP release
        id: resolve
        shell: pwsh
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:EVENT_TAG
          if (-not $tag) { $tag = $env:REQUESTED_TAG }
          if (-not $tag) {
            $h = @{ 'User-Agent' = 'EverythingCmdPal-updater'; Accept = 'application/vnd.github+json' }
            $releases = @(Invoke-RestMethod -Uri 'https://api.github.com/repos/lin-ycv/EverythingCommandPalette/releases?per_page=100' -Headers $h)
            $pattern = '^VictorLin\.EverythingCP_\d+\.\d+\.\d+\.\d+_x64__[^/]+\.msix$'
            $found = @($releases | Where-Object {
              -not $_.draft -and -not $_.prerelease -and
              @($_.assets | Where-Object { $_.name -match $pattern }).Count -gt 0
            } | Select-Object -First 1)
            if ($found.Count -eq 0) { throw 'No published ECP x64 release found.' }
            $tag = $found[0].tag_name
          }
          $data = ./.github/scripts/Resolve-ReleaseMsix.ps1 -ReleaseTag $tag | ConvertFrom-Json
          "found=$($data.Found.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          if ($data.Found) {
            "version=$($data.Version)" >> $env:GITHUB_OUTPUT
            "assets=$($data | ConvertTo-Json -Compress -Depth 5)" >> $env:GITHUB_OUTPUT
            Write-Host "ECP $($data.Version): $(@($data.Installers).Architecture -join ', ')"
          } else { Write-Host "No ECP MSIX in $tag; skipping ECP publishing." }

  publish-chocolatey:
    needs: resolve-release
    if: needs.resolve-release.outputs.found == 'true'
    runs-on: windows-latest
    steps:
      - name: Clone Chocolatey repository
        shell: pwsh
        run: git clone --depth 1 https://github.com/lin-ycv/chocolatey-pkgs.git
      - name: Update and publish ECP package
        shell: pwsh
        working-directory: chocolatey-pkgs/manifests/everythingcmdpal
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
          EXPECTED_VERSION: ${{ needs.resolve-release.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHOCO_API_KEY: ${{ secrets.CHOCOLATEY }}
          CHOCO_REPO_TOKEN: ${{ secrets.CHOCO_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Chocolatey-AU -Force -Scope CurrentUser
          $env:ECP_RELEASE_TAG = $env:RELEASE_TAG
          $result = ./update.ps1
          $version = ([xml](Get-Content ./everythingcmdpal.nuspec -Raw)).package.metadata.version
          if ($version -ne $env:EXPECTED_VERSION) { throw "Unexpected Choco nuspec version $version (expected $env:EXPECTED_VERSION)" }
          $packages = @(Get-ChildItem -Path . -Filter "everythingcmdpal.$($env:EXPECTED_VERSION).nupkg" -File)
          if ($env:DRY_RUN -eq 'true') { Write-Host "Dry run: generated/checked ECP $version. No push."; exit 0 }
          if ($packages.Count -eq 0) { Write-Host 'No new .nupkg (already up-to-date).'; exit 0 }
          if ($packages.Count -ne 1) { throw 'Expected exactly one .nupkg.' }
          if (-not $env:CHOCO_API_KEY) { throw 'Missing CHOCOLATEY secret.' }
          choco push $packages[0].FullName --source 'https://push.chocolatey.org/' --key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey push failed: $LASTEXITCODE" }
          if (-not $env:CHOCO_REPO_TOKEN) {
            Write-Warning 'CHOCO_REPO_TOKEN not set: package pushed, but the source repository was not updated.'
            exit 0
          }
          Push-Location ../..
          try {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add manifests/everythingcmdpal
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { exit 0 }
            git commit -m "Update everythingcmdpal to $env:EXPECTED_VERSION"
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey source commit failed.' }
            $token = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:CHOCO_REPO_TOKEN"))
            git -c "http.extraheader=AUTHORIZATION: basic $token" push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey source push failed.' }
          } finally { Pop-Location }

  publish-winget:
    needs: resolve-release
    if: needs.resolve-release.outputs.found == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winget
          path: winget-templates
      - name: Generate and submit ECP manifests
        shell: pwsh
        env:
          RELEASE_JSON: ${{ needs.resolve-release.outputs.assets }}
          DRY_RUN: ${{ inputs.dry_run }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $data = $env:RELEASE_JSON | ConvertFrom-Json
          $src = Join-Path $PWD 'winget-templates/ECP'
          $out = Join-Path $PWD 'winget-submit'
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item -Path (Join-Path $src '*.yaml') -Destination $out
          $installerFile = Join-Path $out 'lin-ycv.EverythingCmdPal.installer.yaml'
          $installers = @($data.Installers)
          foreach ($file in @(Get-ChildItem $out -Filter '*.yaml')) {
            $yaml = Get-Content $file.FullName -Raw -Encoding utf8
            $yaml = $yaml.Replace('v_VERSION_', $data.ReleaseTag)
            $yaml = $yaml.Replace('_VERSION_', $data.Version)
            if ($file.FullName -eq $installerFile) {
              $lines = @()
              foreach ($item in $installers) {
                $lines += "- Architecture: $($item.Architecture)"
                $lines += "  InstallerUrl: $($item.Url)"
                $lines += "  InstallerSha256: $($item.Sha256)"
              }
              $replacement = "Installers:" + [Environment]::NewLine + ($lines -join [Environment]::NewLine) + [Environment]::NewLine
              $yaml = [regex]::Replace($yaml, '(?ms)^Installers:\s*\r?\n.*?(?=^ManifestType:)', $replacement)
            }
            if ($yaml -match '_(VERSION|X64|HASH64|ARM64|HASHarm64)_') { throw "Unresolved token in $($file.Name)" }
            Set-Content $file.FullName -Value $yaml -Encoding utf8
          }
          if ($env:DRY_RUN -eq 'true') {
            Write-Host "Dry run: ECP $($data.Version), architectures $(@($data.Installers).Architecture -join ', ')"
            Get-Content $installerFile
            exit 0
          }
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) { throw 'Missing WINGET_CREATE_GITHUB_TOKEN secret.' }
          Invoke-WebRequest 'https://aka.ms/wingetcreate/latest' -OutFile wingetcreate.exe
          & ./wingetcreate.exe submit $out -p "New EverythingCmdPal version $($data.Version)"
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submission failed: $LASTEXITCODE" }
